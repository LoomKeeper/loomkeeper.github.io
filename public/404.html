<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="The Loomkeeper page you requested could not be found."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Page not found — Loomkeeper</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Manrope, Inter, system-ui, sans-serif;
        color: #292834;
        background: #f2f2f4;
      }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 660px);
        padding: clamp(36px, 7vw, 72px);
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #e4e0ee;
        border-radius: 28px;
        box-shadow: 0 28px 70px -36px rgba(53, 35, 93, 0.35);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        margin-bottom: 42px;
        color: #292834;
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -0.04em;
        text-decoration: none;
      }
      .mark {
        width: 13px;
        height: 13px;
        margin-right: -8px;
        border-top: 3px solid #ff3d8d;
        border-right: 3px solid #ff3d8d;
      }
      .code {
        margin: 0 0 10px;
        color: #ff3d8d;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(38px, 8vw, 64px);
        line-height: 1.05;
        letter-spacing: -0.05em;
      }
      p {
        max-width: 460px;
        margin: 20px auto 30px;
        color: #656371;
        font-size: 17px;
        line-height: 1.65;
      }
      .home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0 24px;
        border-radius: 12px;
        color: white;
        background: linear-gradient(135deg, #ff3d8d, #e83279);
        box-shadow: 0 12px 28px -14px rgba(255, 61, 141, 0.75);
        font-weight: 700;
        text-decoration: none;
      }
      .home:focus-visible {
        outline: 3px solid #6c51eb;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Loomkeeper home">
        <span class="mark" aria-hidden="true"></span>Loomkeeper
      </a>
      <div class="code">Error 404</div>
      <h1>This page got lost.</h1>
      <p>
        The address may have changed or the page may no longer exist. Return to
        Loomkeeper to keep exploring.
      </p>
      <a class="home" href="/">Back to Loomkeeper</a>
    </main>
  </body>
</html>
