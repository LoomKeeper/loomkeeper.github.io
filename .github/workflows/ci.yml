name: Check landing page

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Production web app origin, set explicitly so pull requests are checked
      # against the real destination of the account links.
      VITE_APP_ORIGIN: https://app.loomkeeper.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Check links
        run: npm test -- dist/index.html
